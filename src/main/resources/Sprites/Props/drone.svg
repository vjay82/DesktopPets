<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Prop: a little quadcopter delivery drone used by the rare "delivery
       drone" event (DroneVisitor / Pet.runDroneEventLoop). Front view: a
       central body with two rotor arms (blurred spinning discs) and a hook
       underneath from which a wrapped gift is lowered. Square viewBox so it
       renders through Doodle.render like the other Sprites/Props/*.svg. -->
  <defs>
    <linearGradient id="droneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565c66"/>
      <stop offset="1" stop-color="#31353d"/>
    </linearGradient>
    <radialGradient id="rotorBlur" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdd6e0" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#cdd6e0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#cdd6e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rotor arms bar -->
  <rect x="9" y="39" width="82" height="6" rx="3" fill="#3a3f47" stroke="#23262b" stroke-width="1.2"/>
  <!-- Spinning rotor discs -->
  <ellipse cx="17" cy="39" rx="16" ry="4.2" fill="url(#rotorBlur)"/>
  <ellipse cx="83" cy="39" rx="16" ry="4.2" fill="url(#rotorBlur)"/>
  <!-- Motors -->
  <rect x="12" y="37" width="9" height="7" rx="2" fill="#23262b"/>
  <rect x="79" y="37" width="9" height="7" rx="2" fill="#23262b"/>
  <!-- Body -->
  <rect x="37" y="41" width="26" height="17" rx="6" fill="url(#droneBody)" stroke="#23262b" stroke-width="1.6"/>
  <!-- Status lights -->
  <circle cx="44" cy="49" r="1.8" fill="#7dff8a"/>
  <circle cx="56" cy="49" r="1.8" fill="#ff6d6d"/>
  <!-- Camera dome -->
  <circle cx="50" cy="59" r="5.2" fill="#2a2e35" stroke="#23262b" stroke-width="1.2"/>
  <circle cx="50" cy="59" r="2" fill="#7fd0ff"/>
  <!-- Delivery hook -->
  <line x1="50" y1="63" x2="50" y2="72" stroke="#3a3f47" stroke-width="1.6"/>
  <circle cx="50" cy="73" r="2.2" fill="#3a3f47"/>
</svg>
