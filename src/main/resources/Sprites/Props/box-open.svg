<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Prop: an OPEN cardboard box used by the rare "cardboard box" event
       (CardboardBoxVisitor / Pet.runBoxEventLoop). The four flaps are splayed
       out and there is a TRANSPARENT gap in the upper-middle (roughly
       x 32..68, y 24..47) through which the visiting pet (drawn BEHIND this
       always-on-top overlay) pokes its head — the classic "kitten in a box".
       The opaque dark interior + front panel below hide the pet's lower body.
       Square viewBox so it renders through Doodle.render like the other
       Sprites/Props/*.svg. -->
  <defs>
    <linearGradient id="boxFront2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b277"/>
      <stop offset="1" stop-color="#b07f3f"/>
    </linearGradient>
    <linearGradient id="boxLid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c590"/>
      <stop offset="1" stop-color="#caa05c"/>
    </linearGradient>
  </defs>
  <!-- Back flaps, splayed up-and-out (narrow so a wide gap stays open) -->
  <path d="M30 47 L9 31 L19 26 L34 42 Z" fill="url(#boxLid2)" stroke="#6e4d22" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M70 47 L91 31 L81 26 L66 42 Z" fill="url(#boxLid2)" stroke="#6e4d22" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Dark interior opening just below the gap -->
  <path d="M26 47 L74 47 L70 58 L30 58 Z" fill="#3a2a16"/>
  <!-- Front panel -->
  <rect x="20" y="52" width="60" height="38" rx="2.5" fill="url(#boxFront2)" stroke="#6e4d22" stroke-width="2"/>
  <!-- Front flaps folding down toward the viewer -->
  <path d="M20 52 L7 64 L20 66 Z" fill="url(#boxLid2)" stroke="#6e4d22" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M80 52 L93 64 L80 66 Z" fill="url(#boxLid2)" stroke="#6e4d22" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Front shading -->
  <rect x="20" y="52" width="60" height="7" fill="#6e4d22" opacity="0.15"/>
</svg>
