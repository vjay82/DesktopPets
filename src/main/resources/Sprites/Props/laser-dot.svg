<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Prop: a glowing red laser-pointer dot used by the rare "laser pointer"
       event (LaserPointerVisitor / Pet.runLaserEventLoop). A bright core with
       a soft red halo, centred so it can be placed exactly at a target point.
       Square viewBox so it renders through Doodle.render like the other
       Sprites/Props/*.svg. -->
  <defs>
    <radialGradient id="laserGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#ff5a5a"/>
      <stop offset="0.55" stop-color="#e21414" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e21414" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Soft halo -->
  <circle cx="50" cy="50" r="46" fill="url(#laserGlow)"/>
  <!-- Bright core -->
  <circle cx="50" cy="50" r="9" fill="#ff3b3b"/>
  <!-- Hot specular highlight -->
  <circle cx="47" cy="47" r="3.2" fill="#ffe0e0"/>
</svg>
