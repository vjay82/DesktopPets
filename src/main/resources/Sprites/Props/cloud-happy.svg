<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Prop: the HAPPY variant of the grumpy rain cloud (cloud.svg). Same puffy
       body, but a cheerful face — shown by Pet.runRainCloudEventLoop once the
       cloud has SUCCESSFULLY rained on (drenched) a pet. Brighter, sunnier
       blue tint than the grey grumpy cloud. The rain itself stays a SEPARATE
       animated sprite (rain1..rain4.svg); this sprite is the cloud ONLY. -->
  <defs>
    <linearGradient id="cloudBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeafa"/>
      <stop offset="1" stop-color="#7fb6d6"/>
    </linearGradient>
  </defs>
  <!-- Cloud puffs -->
  <g fill="url(#cloudBody)" stroke="#4d5666" stroke-width="1.6" stroke-linejoin="round">
    <rect x="28" y="40" width="48" height="18" rx="9"/>
    <ellipse cx="36" cy="42" rx="16" ry="13"/>
    <ellipse cx="54" cy="35" rx="19" ry="16"/>
    <ellipse cx="71" cy="43" rx="15" ry="12"/>
  </g>
  <!-- Cheerful raised eyebrows -->
  <path d="M40 36 Q46 32 52 35" fill="none" stroke="#2e333d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M70 36 Q64 32 58 35" fill="none" stroke="#2e333d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Happy closed eyes (^ ^) -->
  <path d="M42 47 Q46 42 50 47" fill="none" stroke="#2e333d" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M60 47 Q64 42 68 47" fill="none" stroke="#2e333d" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="41" cy="51" rx="3.2" ry="2.1" fill="#f6a6a6" opacity="0.75"/>
  <ellipse cx="69" cy="51" rx="3.2" ry="2.1" fill="#f6a6a6" opacity="0.75"/>
  <!-- Big smile -->
  <path d="M46 51 Q55 59 64 51" fill="none" stroke="#2e333d" stroke-width="2.2" stroke-linecap="round"/>
</svg>
