<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Prop: a little propeller plane (side view, nose to the RIGHT) with a
       Ducky passenger baked right into the open cockpit — used by the rare
       airplane fly-by event (AirplaneVisitor / Pet.runAirplaneEventLoop). The
       duck is part of THIS art (no separate overlay window), so the plane and
       its passenger always move as one. For right-to-left flight the rendered
       icon is mirrored horizontally at runtime. Square viewBox so it renders
       through Doodle.render exactly like the other Sprites/Props/*.svg. -->
  <defs>
    <linearGradient id="planeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset="0.5" stop-color="#e23b3b"/>
      <stop offset="1" stop-color="#a81c1c"/>
    </linearGradient>
    <linearGradient id="planeWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd96a"/>
      <stop offset="1" stop-color="#e09a1c"/>
    </linearGradient>
    <radialGradient id="propBlur" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6dee6" stop-opacity="0.6"/>
      <stop offset="0.65" stop-color="#d6dee6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d6dee6" stop-opacity="0"/>
    </radialGradient>
    <!-- Teal duck palette, matched to the Ducky pet sprite (body #236b61 with
         #55948b/#afd5d0 highlights, golden #aa7f38 beak). -->
    <linearGradient id="duckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a9b90"/>
      <stop offset="0.6" stop-color="#2a7065"/>
      <stop offset="1" stop-color="#16524a"/>
    </linearGradient>
    <linearGradient id="duckBeak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecc687"/>
      <stop offset="1" stop-color="#aa7f38"/>
    </linearGradient>
  </defs>

  <!-- Horizontal tail stabilizer (rear-left) -->
  <path d="M11 55 L27 52 L27 59 L13 61 Z" fill="url(#planeWing)" stroke="#9c6f12" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- Vertical tail fin (rear) -->
  <path d="M18 51 L25 27 L35 31 L33 51 Z" fill="url(#planeBody)" stroke="#7d1414" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Fuselage: tail (left) to nose (right) -->
  <path d="M18 54
           C18 46 30 43 44 43
           L66 43
           C80 43 86 48 88 55
           C86 62 80 65 66 65
           L40 65
           C26 65 18 62 18 54 Z"
        fill="url(#planeBody)" stroke="#7d1414" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Belly shading -->
  <path d="M24 62 C40 67 70 67 84 60 C74 65 40 66 24 62 Z" fill="#7d1414" opacity="0.35"/>

  <!-- Cockpit seat well (open; the duck sits down into it) -->
  <path d="M42 45 Q42 35 52 34 Q62 35 62 45 Z" fill="#3a2a1a" opacity="0.55"/>

  <!-- ===== Ducky passenger: the chunky TEAL duck, matching the Ducky pet
       sprite, seated in the open cockpit and facing forward/right ===== -->
  <!-- Chunky rounded head/body, settled down into the cockpit well -->
  <ellipse cx="51" cy="33" rx="11" ry="10.5" fill="url(#duckBody)" stroke="#0d3a33" stroke-width="0.9"/>
  <!-- Lighter teal facet highlight on the upper-left of the head -->
  <path d="M43 31 Q45 24 52 23.5 Q48 27.5 46.5 33 Q44 33 43 31 Z" fill="#8cc7bb" opacity="0.6"/>
  <!-- Lower-body shading where the duck meets the cockpit -->
  <path d="M42 38 Q51 44 60 38 Q56 42.5 51 43 Q46 42.5 42 38 Z" fill="#0d3a33" opacity="0.38"/>
  <!-- Wide flat beak, pointing forward/right (upper + lower bill) -->
  <path d="M58 31 L71 30.5 L71 35 L58 36.5 Z" fill="url(#duckBeak)" stroke="#6f4f1c" stroke-width="0.7" stroke-linejoin="round"/>
  <line x1="59" y1="33.4" x2="70.5" y2="32.6" stroke="#6f4f1c" stroke-width="0.5" opacity="0.55"/>
  <!-- Eye -->
  <circle cx="54.5" cy="30" r="1.8" fill="#0a1512"/>
  <circle cx="53.9" cy="29.4" r="0.6" fill="#fff"/>

  <!-- Landing gear + wheel: drawn BEHIND the near wing so the opaque wing hides
       the upper leg — only the wheel + short lower leg show below the wing's
       edge (fixes the wheel previously showing "through" the wing). -->
  <line x1="59" y1="68" x2="59" y2="85" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="59" cy="88" r="4" fill="#333" stroke="#111" stroke-width="1"/>
  <circle cx="59" cy="88" r="1.5" fill="#8a8a8a"/>

  <!-- Main wing (near side), sweeping down/back below the fuselage; opaque so it
       occludes the upper landing-gear leg behind it -->
  <path d="M40 61 L78 61 L66 80 L50 80 Z" fill="url(#planeWing)" stroke="#9c6f12" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Wing strut detail -->
  <line x1="54" y1="63" x2="58" y2="78" stroke="#9c6f12" stroke-width="1.3"/>

  <!-- Fuselage porthole -->
  <circle cx="31" cy="54" r="2.4" fill="#c4ecff" stroke="#5b9ab5" stroke-width="0.8"/>

  <!-- Nose spinner -->
  <path d="M86 49 Q93 55 86 61 Z" fill="url(#planeWing)" stroke="#9c6f12" stroke-width="1.1"/>
  <!-- Propeller: blur disc + blade + hub -->
  <ellipse cx="92" cy="55" rx="4.2" ry="14" fill="url(#propBlur)"/>
  <line x1="92" y1="41" x2="92" y2="69" stroke="#39404a" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <circle cx="92" cy="55" r="3" fill="#ffd96a" stroke="#9c6f12" stroke-width="1.2"/>
</svg>
